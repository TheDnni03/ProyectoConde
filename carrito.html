<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link rel="stylesheet" href="carrito.css">
</head>
<body>

    <div class="contenedor">

        <h1>🛒 Tu carrito</h1>

        <div id="carrito-lista" class="lista"></div>

        <div class="acciones">
            <button id="vaciar" class="btn rojo">Vaciar carrito</button>

            <!-- BOTÓN COMPRAR (con total dinámico) -->
            <a id="btn-comprar" href="compra.html" class="btn verde">Comprar carrito</a>

            <a href="catalogo.html" class="btn azul">Regresar al catálogo</a>
        </div>

    </div>

<script>
/* ===========================
   UTILIDADES DEL CARRITO
   =========================== */

function cargarCarrito() {
    const data = localStorage.getItem("cart");
    return data ? JSON.parse(data) : [];
}

function guardarCarrito(carrito) {
    localStorage.setItem("cart", JSON.stringify(carrito));
}

/* ===========================
   CÁLCULO DE TOTAL
   - Usa item.price si existe (número o string)
   - Si no existe price en item, intenta usar 0
   =========================== */
function calcularTotal(carrito) {
    return carrito.reduce((acc, item) => {
        const precio = Number(item.price ?? 0) || 0;
        const cantidad = Number(item.cantidad ?? 1) || 1;
        return acc + precio * cantidad;
    }, 0);
}

function formatearMXN(n) {
    // Formatea con separador de miles y sin decimales
    return n.toLocaleString('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* ===========================
   ACTUALIZAR BOTÓN COMPRAR
   =========================== */
function actualizarBotonTotal() {
    const btn = document.getElementById("btn-comprar");
    const carrito = cargarCarrito();
    const total = calcularTotal(carrito);

    if (carrito.length === 0) {
        btn.textContent = "Comprar carrito";
        btn.removeAttribute('data-total');
    } else {
        btn.textContent = `Comprar carrito — ${formatearMXN(total)}`;
        btn.setAttribute('data-total', total);
    }
}

/* ===========================
   RENDER DEL CARRITO
   =========================== */
function renderCarrito() {
    const cont = document.getElementById("carrito-lista");
    let carrito = cargarCarrito();

    cont.innerHTML = "";

    if (!carrito || carrito.length === 0) {
        cont.innerHTML = `<p class="vacio">Aún no has agregado nada 👀</p>`;
        actualizarBotonTotal();
        return;
    }

    carrito.forEach(item => {
        const precioUnit = Number(item.price ?? 0) || 0;
        const cantidad = Number(item.cantidad ?? 1) || 1;
        const subtotal = precioUnit * cantidad;

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div class="info">
                <img src="${item.img}" alt="${item.name || 'Producto'}" class="thumb">
                <div class="meta">
                    <h3>${item.name ?? 'Sin nombre'}</h3>
                    <p>ID: ${item.id ?? '-'}</p>
                    <p>Precio unitario: <strong>${formatearMXN(precioUnit)}</strong></p>
                    <p>Cantidad: <strong>${cantidad}</strong></p>
                    <p>Subtotal: <strong>${formatearMXN(subtotal)}</strong></p>
                </div>
            </div>

            <div class="acciones-item">
                <button class="eliminar" data-id="${item.id}">❌</button>
            </div>
        `;

        cont.appendChild(div);
    });

    /* Asignar eventos a botones eliminar */
    document.querySelectorAll(".eliminar").forEach(btn => {
        btn.addEventListener("click", e => {
            const id = e.currentTarget.dataset.id;
            let carrito = cargarCarrito();
            carrito = carrito.filter(p => String(p.id) !== String(id));
            guardarCarrito(carrito);
            renderCarrito();        // re-renderiza
            actualizarBotonTotal(); // actualiza total
        });
    });

    // Actualizar botón total después de renderizar
    actualizarBotonTotal();
}

/* ===========================
   VACIAR CARRITO
   =========================== */
document.getElementById("vaciar").addEventListener("click", () => {
    localStorage.removeItem("cart");
    renderCarrito();
    actualizarBotonTotal();
});

/* ===========================
   INICIALIZAR
   =========================== */
renderCarrito();
actualizarBotonTotal();
</script>

</body>
</html>
