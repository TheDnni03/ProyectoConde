version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: proyectoconde_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: proyectoconde
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ../
      dockerfile: docker/laravel/Dockerfile
    container_name: proyectoconde_php
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../app:/var/www/html
      - ../storage:/var/www/html/storage
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: proyectoconde
      DB_USERNAME: appuser
      DB_PASSWORD: apppass
    networks:
      - appnet

  nginx:
    image: nginx:stable
    container_name: proyectoconde_nginx
    depends_on:
      - php
    volumes:
      - ../app:/var/www/html:ro
      - ./laravel/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - appnet

  python:
    build:
      context: ..
      dockerfile: docker/python/Dockerfile
    container_name: proyectoconde_python
    depends_on:
      - mysql
    volumes:
      - ../python-app:/usr/src/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: proyectoconde
      DB_USER: appuser
      DB_PASS: apppass
    ports:
      - "5000:5000"
    networks:
      - appnet

