<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Registro</title>
    <link rel="stylesheet" href="relog.css">
</head>

<body>

    <!-- Fondo con slideshow -->
    <div class="background-slider">
        <div class="slide active"></div>
        <div class="slide"></div>
    </div>

    <!-- Caja de registro -->
    <div class="register-box">
        <h2>Crear Cuenta</h2>

        <!-- Correo -->
        <div class="input-group">
            <input type="email" placeholder="Correo electrónico">
        </div>

        <!-- Contraseña -->
        <div class="input-group">
            <input type="password" id="pass1" placeholder="Contraseña">
            <span class="toggle-eye" onclick="togglePass('pass1', this)">👁</span>
        </div>

        <!-- Repetir contraseña -->
        <div class="input-group">
            <input type="password" id="pass2" placeholder="Confirmar contraseña">
            <span class="toggle-eye" onclick="togglePass('pass2', this)">👁</span>
        </div>

        <!-- Botón -->
        <a href="catalogo.html" class="login-btn">Iniciar sesión</a>
    </div>

    <!-- JS toggle password -->
    <script>
        function togglePass(id, icon) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        // Slideshow
        let current = 0;
        const slides = document.querySelectorAll(".slide");

        setInterval(() => {
            slides[current].classList.remove("active");
            current = (current + 1) % slides.length;
            slides[current].classList.add("active");
        }, 5000);
    </script>

</body>
</html>
