<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo</title>
  <link rel="stylesheet" href="cat.css">
</head>
<body>
  <div class="page-blur"></div>

  <a class="cart-link" href="carrito.html" title="Ver carrito">🛒</a>

  <div class="wrapper">
    <!-- Search -->
    <div class="search-wrap">
      <div class="search-box">
        <input id="q" type="text" placeholder="Buscar por nombre o ID (ej: podcast o 1)" />
        <button id="searchBtn">Buscar</button>
      </div>
    </div>

    <!-- Carousel -->
    <div class="carousel-wrap">
      <button class="nav-btn left" id="prevBtn" aria-label="Anterior">&#10094;</button>

      <div class="carousel-viewport" role="region" aria-label="Catálogo">
        <div class="carousel-track" id="track">
          
          <div class="slide" data-id="1" data-name="podcast">
            <p class="precio">$30 MXN</p>
            <img src="https://www.shutterstock.com/image-vector/trendy-halftone-collage-podcast-broadcast-260nw-2597695059.jpg" alt="Podcast">
          </div>

          <div class="slide" data-id="2" data-name="pelicula">
            <p class="precio">$100 MXN</p>
            <img src="https://i.pinimg.com/originals/47/f2/2f/47f22f40160ffb33987fa4b9091dcee0.jpg" alt="Película">
          </div>

          <div class="slide" data-id="3" data-name="audiolibro">
            <p class="precio">$50 MXN</p>
            <img src="https://i.scdn.co/image/ab6765630000ba8ab90a38cb105664d9bd715bac" alt="Audiolibro">
          </div>

        </div>
      </div>

      <button class="nav-btn right" id="nextBtn" aria-label="Siguiente">&#10095;</button>
    </div>

    <!-- controls -->
    <div class="controls">
      <button id="addBtn" class="add-btn">Agregar al carrito</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

<script>
(() => {
  const track = document.getElementById('track');
  const slides = Array.from(track.querySelectorAll('.slide'));
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const addBtn = document.getElementById('addBtn');
  const q = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const dotsWrap = document.getElementById('dots');

  let index = 0;
  let autoplay = null;
  const gap = 18;
  let slideWidth = 0;

  function computeSlideWidth() {
    const s = slides[0];
    if (!s) return 0;
    return s.offsetWidth + gap;
  }

  function centerTrack() {
    slideWidth = computeSlideWidth();
    const viewport = document.querySelector('.carousel-viewport');
    const viewportW = viewport.clientWidth;
    const slideW = slides[0].offsetWidth;

    const centerOffset = (viewportW / 2) - (slideW / 2);
    const translateX = centerOffset - index * slideWidth;

    track.style.transform = `translateX(${translateX}px)`;

    slides.forEach((s, i) =>
      s.classList.toggle('active', i === index)
    );

    updateDots();
  }

  function go(i) {
    index = (i + slides.length) % slides.length;
    centerTrack();
    restartAutoplay();
  }

  function next() { go(index + 1); }
  function prev() { go(index - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  function startAutoplay() {
    stopAutoplay();
    autoplay = setInterval(next, 3000);
  }

  function stopAutoplay() {
    if (autoplay) clearInterval(autoplay);
  }

  function restartAutoplay() {
    stopAutoplay();
    startAutoplay();
  }

  function buildDots() {
    dotsWrap.innerHTML = '';
    slides.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'dot' + (i === 0 ? ' active' : '');
      b.addEventListener('click', () => go(i));
      dotsWrap.appendChild(b);
    });
  }

  function updateDots() {
    const ds = dotsWrap.querySelectorAll('.dot');
    ds.forEach((d, i) => d.classList.toggle('active', i === index));
  }

  function search(query) {
    query = query.trim().toLowerCase();
    if (!query) return;

    const found = slides.findIndex(s =>
      s.dataset.name.toLowerCase().includes(query) ||
      s.dataset.id === query
    );

    if (found >= 0) {
      go(found);
    } else {
      alert("No se encontró ningún resultado.");
    }
  }

  searchBtn.addEventListener('click', () => search(q.value));
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') search(q.value);
  });

  /* ====================================
     7. AGREGAR AL CARRITO — ARREGLADO
  ==================================== */
  addBtn.addEventListener('click', () => {
    const s = slides[index];

    // EXTRAER PRECIO REAL DEL TEXTO
    const rawPrice = s.querySelector(".precio").textContent;
    const price = Number(rawPrice.replace(/[^0-9]/g, "")); // ← LIMPIA $ y MXN

    const item = {
      id: s.dataset.id,
      name: s.dataset.name,
      img: s.querySelector('img').src,
      price: price // ← YA SE GUARDA NUMÉRICO
    };

    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.push(item);
    localStorage.setItem('cart', JSON.stringify(cart));

    addBtn.classList.add('zoom');
    setTimeout(() => addBtn.classList.remove('zoom'), 250);
  });

  window.addEventListener('load', () => {
    buildDots();
    centerTrack();
    startAutoplay();
  });

  window.addEventListener('resize', () => {
    centerTrack();
  });

})();
</script>

</body>
</html>
