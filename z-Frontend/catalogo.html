      </div>

      <button class="nav-btn right" id="nextBtn" aria-label="Siguiente">&#10095;</button>
    </div>

    <div class="controls">
      <button id="addBtn" class="add-btn">Agregar al carrito</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

<script>
(() => {
  const track = document.getElementById('track');
  const slides = Array.from(track.querySelectorAll('.slide'));
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const addBtn = document.getElementById('addBtn');
  const q = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const dotsWrap = document.getElementById('dots');

  let index = 0;
  let autoplay = null;
  const gap = 18;

  slides.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'dot' + (i===0 ? ' active' : '');
    b.addEventListener('click', ()=> { go(i); });
    dotsWrap.appendChild(b);
  });

  function updateDots(){
    const ds = dotsWrap.querySelectorAll('.dot');
    ds.forEach((d, i)=> d.classList.toggle('active', i===index));
  }

  function computeSlideSizes(){
    const rect0 = slides[0].getBoundingClientRect();
    const totalWidth = rect0.width + gap;
    return totalWidth;
  }

  function centerTrack(){
    if (!slides.length) return;
    const viewport = document.querySelector('.carousel-viewport');
    const viewportW = viewport.clientWidth;
    const slideRect = slides[0].getBoundingClientRect();
    const slideW = slideRect.width;
    const spacing = computeSlideSizes();

    const centerOffset = (viewportW / 2) - (slideW / 2);
    const translateX = centerOffset - index * spacing;
    track.style.transform = `translateX(${translateX}px)`;

    slides.forEach((s,i)=>{
      s.classList.toggle('active', i===index);
    });

    updateDots();
  }

  function go(i){
    index = ((i % slides.length) + slides.length) % slides.length;
    centerTrack();
    restartAutoplay();
  }

  function next(){
    go(index+1);
  }
  function prev(){
    go(index-1);
  }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  function startAutoplay(){
    if (autoplay) clearInterval(autoplay);
    autoplay = setInterval(()=> next(), 3000);
  }
  function restartAutoplay(){ startAutoplay(); }

  addBtn.addEventListener('click', ()=>{
    const active = slides[index];
    const item = {
      id: active.dataset.id,
      name: active.dataset.name,
      img: active.querySelector('img').src
    };
    let c = JSON.parse(localStorage.getItem('cart') || '[]');
    c.push(item);
    localStorage.setItem('cart', JSON.stringify(c));
    addBtn.classList.add('zoom');
    setTimeout(()=> addBtn.classList.remove('zoom'), 300);
  });

  function search(qs){
    const query = String(qs).trim().toLowerCase();
    if (!query) return;
    const found = slides.findIndex(s=> s.dataset.name.includes(query) || s.dataset.id === query);
    if (found >= 0) { go(found); }
  }
  searchBtn.addEventListener('click', ()=> search(q.value));
  q.addEventListener('keydown', e=> { if (e.key === 'Enter') search(q.value); });

  window.addEventListener('load', ()=> {
    centerTrack();
    startAutoplay();
  });
  window.addEventListener('resize', centerTrack);

  centerTrack();
})();
</script>
</body>
</html>
